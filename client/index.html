    <script>
      // Apply the phone composition to actual mobile browsers, including when
      // the phone is rotated. Chrome's Desktop site UA is intentionally left
      // unmarked so it follows the desktop layout breakpoints.
      (() => {
        const screenWidth = window.screen?.width || window.innerWidth;
        const screenHeight = window.screen?.height || window.innerHeight;
        const hasTouch = navigator.maxTouchPoints > 0 || "ontouchstart" in window;
        const mobileBrowser = navigator.userAgentData?.mobile === true || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (hasTouch && mobileBrowser && Math.min(screenWidth, screenHeight) <= 900) {
          document.documentElement.classList.add("mobile-device-layout");
        }
      })();
    </script>
